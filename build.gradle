/*
 * Gradle build configuration for the HackHub backend.
 *
 * This file defines the project metadata, Java version, dependency
 * management, application dependencies, and test configuration.
 */

plugins {
	// Enables Java compilation and testing support.
	id 'java'
	// Adds Spring Boot build and packaging support.
	id 'org.springframework.boot' version '3.5.15'
	// Imports Spring's managed dependency versions.
	id 'io.spring.dependency-management' version '1.1.7'
	// Adds AppMap recording support for Gradle test runs.
	id 'com.appland.appmap' version '1.2.0'
}

group = 'com.hackhub'
version = '0.9.9'
description = 'HackHub - Hackathon Management Platform'

java {
	toolchain {
		// Java version used to compile and run the project.
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	// Main public repository used to resolve dependencies.
	mavenCentral()
}

dependencies {
	// Persistence layer support with JPA and Hibernate.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Authentication and authorization support.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Bean validation support for DTOs and request bodies.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// REST API and embedded web server support.
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Swagger UI and OpenAPI documentation.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
	// Lombok annotations available only at compile time.
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// JWT API used by the security layer.
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	// JWT runtime implementations.
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'
	// In-memory database used for development and testing.
	runtimeOnly 'com.h2database:h2'
	// PostgreSQL driver for production or external database usage.
	runtimeOnly 'org.postgresql:postgresql'
	// Spring Boot testing utilities.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Spring Security testing utilities.
	testImplementation 'org.springframework.security:spring-security-test'
	// Lombok support for test sources.
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// JUnit Platform launcher used at test runtime.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// Enables JUnit 5 test execution.
	useJUnitPlatform()
	// Suppresses the harmless JVM CDS warning caused by test instrumentation.
	jvmArgs '-Xshare:off'
}

tasks.named('bootRun') {
	// Local app runs always use the development profile.
	systemProperty 'spring.profiles.active', 'dev'
}

appmap {
	// Root AppMap configuration for the HackHub package.
	configFile = file("$projectDir/appmap.yml")
	// Keep generated test recordings inside Gradle build output.
	outputDirectory = file("$buildDir/appmap")
	debugFile = file("$buildDir/appmap/agent.log")
}

tasks.register('appmap-listen', Exec) {
	group = 'application'
	description = 'Builds the boot jar and runs it with the AppMap Java agent.'

	dependsOn tasks.named('bootJar')

	doFirst {
		def agentJar = file("${System.getProperty('user.home')}/.appmap/lib/java/appmap.jar")
		if (!agentJar.exists()) {
			throw new GradleException("AppMap Java agent not found at ${agentJar}. Install the AppMap extension or download appmap.jar.")
		}

		def bootJarFile = tasks.named('bootJar').get().archiveFile.get().asFile
		commandLine(
			'java',
			"-javaagent:${agentJar.absolutePath}",
			'-Dappmap.config.file=appmap.yml',
			'-Dappmap.output.directory=tmp/appmap',
			'-jar',
			bootJarFile.absolutePath,
			'--spring.profiles.active=dev'
		)
	}
}

tasks.register('cov', Test) {
	group = 'verification'
	description = 'Runs endpoint coverage integration test with threshold enforcement.'

	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	filter {
		includeTestsMatching 'com.hackhub.integration.coverage.EndpointCoverageIntegrationTest'
	}

	// Default threshold is 80 unless overridden at runtime.
	systemProperty 'endpoint.coverage.threshold', System.getProperty(
		'endpoint.coverage.threshold',
		'80'
	)

	// Always run so the latest endpoint coverage is recalculated every time.
	outputs.upToDateWhen { false }

	testLogging {
		events 'passed', 'skipped', 'failed'
	}

	doLast {
		def reportFile = file(
			"$buildDir/test-results/cov/TEST-com.hackhub.integration.coverage.EndpointCoverageIntegrationTest.xml"
		)
		if (!reportFile.exists()) {
			println 'Endpoint coverage result not found.'
			return
		}

		def coverageLine = reportFile
			.readLines()
			.find { line -> line.contains('Endpoint coverage:') }

		if (coverageLine == null) {
			println 'Endpoint coverage line not found in test report.'
			return
		}

		def normalizedLine = coverageLine
			.replaceAll('^.*Endpoint coverage:', 'Endpoint coverage:')
			.replaceAll('<.*$', '')
			.trim()
		println normalizedLine
	}
}
